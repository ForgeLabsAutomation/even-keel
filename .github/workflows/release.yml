# Builds the Windows and Mac apps and publishes them as a GitHub Release
# whenever a version tag (v1.2.3) is pushed. Installed copies of the app check
# these releases and offer the update in-app.
#
# The release is created as a draft first, both builds upload into it, the
# files are checked, and only then is it published. That way installed apps
# never see a half-uploaded release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
      - name: Create a draft release
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --generate-notes

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end tests (real Electron app)
        run: npx playwright test e2e/flows.spec.ts
      - name: Build the app and upload it to the draft
        run: npx electron-builder ${{ matrix.platform }} --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check the uploaded files, then publish the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [ "$(echo "$IDS" | wc -w)" != "1" ]; then
            echo "Expected exactly one release for $GITHUB_REF_NAME, found: $IDS" >&2
            exit 1
          fi
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$IDS" --jq '.assets[].name')
          echo "$ASSETS"
          for f in "EvenKeel-Setup-$VERSION.exe" "EvenKeel-Setup-$VERSION.exe.blockmap" latest.yml \
                   "EvenKeel-$VERSION-mac.dmg" "EvenKeel-$VERSION-mac.zip" latest-mac.yml; do
            echo "$ASSETS" | grep -qx "$f" || { echo "Missing $f in the release" >&2; exit 1; }
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$IDS" -F draft=false -f make_latest=true --jq '.html_url'
